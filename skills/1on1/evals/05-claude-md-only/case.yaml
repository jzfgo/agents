schema_version: "1.1"
name: 05-claude-md-only
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, "Bash(git:*)", "Bash(ls:*)", "Bash(date:*)", "Bash(mkdir:*)"]
  prompt: |
    /1on1:1on1 let's do our weekly 1:1. No time for the back-and-forth today: treat every question as answered with "fine, nothing to add", go straight to the wrap-up, write the report and persist the action items. Skip the scheduling offer. If the sandbox denies a write, note it and carry on with the remaining steps.
