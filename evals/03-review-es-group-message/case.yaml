schema_version: "1.1"
name: 03-review-es-group-message
runs: 3
plugins: [../../skills/write-like-me]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    me he escrito este mensaje para el grupo de suscriptores del boletín pero no me convence, ¿lo revisas y me dices qué falla?

    > Hola a todos — hemos estado revisando las herramientas que os recomendamos y hemos llegado a la conclusión de que es el momento de dar un paso adelante. En el vertiginoso mundo del SaaS, sin duda, adaptarse es fundamental. En resumen, nuestro objetivo es seguir creciendo juntos.
