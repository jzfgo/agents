name: Claude Code

# Same setup as jzfgo/carroquesi: one workflow for the automatic first review
# and for `@claude` follow-ups.
#
# Runs triggered by `issue_comment` are attributed to the DEFAULT branch (a
# comment carries no ref), so `gh run list --branch <feature>` never finds them.
# This run-name gives each run a PR-scoped handle instead:
#   gh run list --workflow=claude.yml --json databaseId,displayTitle
#
# It must stay quoted. Unquoted, YAML reads the " #" as the start of a comment
# and the name truncates to "Claude —", losing the number it exists to carry.
run-name: "Claude — #${{ github.event.issue.number || github.event.pull_request.number }}"

# A PR that edits THIS FILE gets no Claude review. claude-code-action refuses a
# workflow file that differs from the default branch's copy, so a PR cannot
# rewrite its own reviewer and run it with the repo's secrets. The refusal exits
# green having reviewed nothing; the guard step below turns that into a red
# check. Changes here take effect on merge, and the first later PR that does
# not touch this file is what proves them.

on:
  # Automatic first-pass review. Deliberately NOT `synchronize`: a full review on
  # every push is noisy and costly. Ask for follow-ups with an `@claude` comment.
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # THIS REPOSITORY IS PUBLIC. Only `pull_request` runs from forks are denied
    # secrets; the other four triggers run in the base repo context with full
    # secrets whoever wrote the comment, and follow what the comment says. Every
    # trigger therefore requires a trusted author. Do not remove these checks:
    # the agent can still comment and edit through the action's own tools.
    #
    # The agent can read the action's write-scoped app token (see `claude_args`),
    # so everything it reads must come from a trusted account too, not just the
    # trigger. Comment triggers also require the issue's or PR's author to be
    # trusted, `include_comments_by_actor` drops everyone else's comments from
    # the prompt, and the first step below refuses PRs from forks. What is left
    # is WebSearch results, and anything a trusted account pastes in.
    #
    # So `@claude` silently does nothing on PRs opened by bots such as
    # Dependabot (author association CONTRIBUTOR). That is on purpose: their
    # bodies carry upstream release notes, written by whoever maintains the
    # dependency. Review those with Claude locally instead.
    if: |
      (github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    # A hung run would otherwise bill for GitHub's six-hour default.
    timeout-minutes: 30
    # One run per PR or issue at a time: a second @claude waits for the first
    # instead of racing it. On the job, not the workflow, so comments without
    # @claude never join the group (GitHub keeps one pending run per group and
    # would cancel the queued one).
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      # Fails closed: if the lookup fails or the fork is gone, `head` is empty
      # and the run stops. Issues that are not PRs leave `PR` empty and pass.
      - name: Refuse to run on pull requests from forks
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.pull_request && github.event.issue.number || github.event.pull_request.number }}
        run: |
          [ -z "$PR" ] && exit 0
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.head.repo.full_name // ""') || head=
          if [ "$head" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::PR #$PR comes from ${head:-an unknown repository}, not $GITHUB_REPOSITORY. Claude does not run on fork PRs: review it by hand."
            exit 1
          fi

      # Actions are pinned to a commit SHA, not a tag: a tag can be moved to
      # other code, and this job holds the repo's Claude token. To bump one,
      # resolve the new tag to its commit and update the trailing comment.
      #
      # `persist-credentials: false`: the action writes its own token into the
      # checkout before Claude starts, so the job's token has no reason to be
      # there at all. The guard below fetches anonymously, which a public repo
      # allows.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # On `pull_request` the checkout is the merge commit, so a PR that does not
      # touch this file compares identical to the base branch. Only
      # `pull_request` runs attach a check to the PR, so only they need the guard.
      - name: Refuse to no-op when this PR edits the review workflow
        if: github.event_name == 'pull_request'
        run: |
          git fetch --quiet --depth=1 origin "$GITHUB_BASE_REF"
          if ! git diff --quiet FETCH_HEAD -- .github/workflows/claude.yml; then
            echo "::error file=.github/workflows/claude.yml::This PR edits the review workflow, so claude-code-action would refuse to run and exit green having reviewed nothing. Failing instead: review this PR by hand. The edit takes effect on merge, and the first later PR that does not touch this file is what proves it."
            exit 1
          fi

      # The review plugin, pinned to one commit like the action below. Loading it
      # through `plugin_marketplaces` would read the catalog from a default
      # branch and run whatever landed there that day, with this job's token and
      # tools. It loads with `--plugin-dir` (in `claude_args`), not as a
      # marketplace: Claude Code accepts the `claude-plugins-official` catalog
      # name only from the `anthropics` org on GitHub.
      #
      # Move this `ref:` by hand: pick a commit that touches plugins/code-review
      # and is at least 7 days old.
      #
      # The plugin reads the repo's rules from CLAUDE.md, which here is already
      # a symlink to AGENTS.md, so no extra link is needed.
      - name: Check out the review plugin at a pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anthropics/claude-plugins-official
          ref: 9780cf407f5593727b668bae95a0c4ae2e0de1ae # code-review 1.0.1, 2026-10-26
          path: .review-plugins
          persist-credentials: false

      # An `@claude` run that commits could pick the plugin checkout up with
      # `git add .`, so git is told to ignore it.
      - name: Keep the plugin checkout out of git
        run: echo /.review-plugins >> .git/info/exclude

      # When bumping this pin, open src/github/operations/comments/common.ts at
      # the new version and check that the spinner image id (SPINNER_HTML) and
      # the placeholder line ("I'll analyze this and get back to you.") still
      # match the two strings in skills/babysit-pr/scripts/review-runs.sh.
      # Check the spinner in src/create-prompt/index.ts too: the agent copies
      # it from that prompt, not from common.ts. If any of them changed, that
      # script's `written` check stops flagging unfinished reviews without
      # any error.
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Only these accounts' comments, reviews and inline review comments
          # reach the prompt; anyone else's are dropped. Add a collaborator here
          # when you add one to the repo, or their comments will be invisible.
          include_comments_by_actor: "jzfgo,claude[bot]"

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # The automatic review on `pull_request` runs exactly like an `@claude`
          # re-review: tag mode, the same default prompt (PR title and body,
          # comments, changed files, CLAUDE.md) and one tracking comment edited
          # in place. `track_progress` is what forces tag mode on this event;
          # without it a `prompt` means agent mode. The prompt below stands in
          # for the comment a person would have written, and the action appends
          # it as custom instructions.
          #
          # It used to run the code-review plugin instead. That plugin keeps
          # only high-confidence bugs and quotable CLAUDE.md breaches and drops
          # edge cases, risks and test gaps by design, so on carroquesi #530-532
          # it posted "No issues found" where an `@claude` re-review of the same
          # commit returned a full report. It is still loaded, so
          # `@claude /code-review:code-review` runs it on request.
          #
          # Every other trigger passes an empty prompt, so the action follows the
          # comment that mentioned @claude, in tag mode as before.
          track_progress: ${{ github.event_name == 'pull_request' }}
          prompt: ${{ github.event_name == 'pull_request' && format('Review this pull request in full (HEAD {0}). Read the whole diff against the base branch and the code around it, and check it against the PR title and description and against every AGENTS.md or CLAUDE.md that covers the changed files. Report bugs, unhandled edge cases, risks, gaps in test coverage and mismatches with the description, and say which ones should block the merge. Post your findings in your comment even if there are none.', github.event.pull_request.head.sha) || '' }}

          # `--model`: without it the action runs on Sonnet, and v1 has no
          # `model` input, so `claude_args` is the only vehicle.
          #
          # `--allowedTools` is an AUTO-APPROVAL list: a tool left off it still
          # exists, but its call hits a permission prompt nothing in CI can
          # answer, so it comes back denied. This adds to the defaults.
          # - The inline-comment tool is how a review comments on a line;
          #   allowing it is also what makes the action start its server.
          # - WebSearch lets the reviewer check claims against sources.
          # - No WebFetch. The action writes its write-scoped app token into
          #   origin's URL in `.git/config`, and Claude can read it: Claude Code
          #   auto-approves read-only shell commands, and a glob (`cat .g?t/c*`)
          #   slips past `Read(./.git/**)` deny rules, so no denylist hides it.
          #   WebFetch would let injected text send it to any server. Without it
          #   the only way out is a comment on the PR, in public, and the token
          #   is revoked when the job ends (the action's `Revoke app token`).
          # - No `Bash(gh api:*)`. It would let the reviewer read rulesets and
          #   run status, but a prefix rule cannot stop `-X POST`/`-X DELETE`
          #   at the end, so injected text in a PR could write through it.
          #   Claims about repo settings get flagged as unverified instead.
          # - No git Bash rules of this file's own, not even "read-only"
          #   subcommands. A prefix rule cannot vet arguments: `git -c
          #   <key>=<cmd>`, `git config` and `git grep -O<cmd>` run commands,
          #   `--output=<file>` on log/diff/show writes any file, and a bare
          #   repo committed in a PR can carry its own config (fsmonitor,
          #   pager) that any git call inside it obeys. The job's
          #   `contents: read` does not contain that: the action acts with its
          #   own app token. Tag mode still adds the action's own git rules and
          #   push wrapper on every trigger, so an `@claude` run can push to the
          #   PR branch, and tag mode also gives every run the CI tools that
          #   read results through `actions: read`.
          #
          # `--disallowedTools`:
          # - `ScheduleWakeup` on every run: see the step's `env` below.
          # - On `pull_request` runs, the automatic review only reads and
          #   comments, so the git write commands that tag mode allows (`add`,
          #   `commit`, `rm`) are denied, and so are the edit tools that its
          #   `acceptEdits` would allow. On an open PR, with no commit, the push
          #   wrapper has nothing to push. (If the PR closes before the action
          #   sets up its branch, the action makes a new `claude/` branch from
          #   the base. The wrapper could push that branch, and the action's own
          #   cleanup could commit leftover changes to it. Neither reaches the
          #   PR branch or the base.) Not all of `Bash` is denied: that would
          #   also block the read-only `git diff` and `git log`, and tag mode
          #   has no other way to see the diff. A deny rule wins over the
          #   action's own allow list. An `@claude` run keeps the write commands
          #   and the edit tools, so it can still push a fix when asked. This
          #   list is complete only while `use_commit_signing` is off: with it
          #   on, the action commits through its `mcp__github_file_ops__*`
          #   tools, which would need denying too.
          claude_args: '--model claude-opus-5-5 --plugin-dir ${{ github.workspace }}/.review-plugins/plugins/code-review --allowedTools "mcp__github_inline_comment__create_inline_comment,WebSearch" --disallowedTools "${{ github.event_name == ''pull_request'' && ''ScheduleWakeup,Bash(git add:*),Bash(git commit:*),Bash(git rm:*),Edit,MultiEdit,Write,NotebookEdit'' || ''ScheduleWakeup'' }}"'
        # Subagents must run in the foreground. Launched in the background, the
        # main agent ends its turn "waiting on them", the headless session
        # exits there, and they die before posting (jzfgo/carroquesi run
        # 44847076788). That is why most automatic reviews here posted
        # nothing. The variable removes `run_in_background` from Agent and
        # Bash, and the action passes the step's environment to Claude. A
        # prompt asking for the foreground would be a suggestion only; this
        # leaves the agent no background option it is allowed to use (Monitor
        # and MCP tasks still background, but Monitor is not in
        # `--allowedTools`, so CI denies it, and none of the action's MCP
        # servers run tools as tasks). `ScheduleWakeup` is disallowed for the
        # same reason: a headless session never wakes up, so a scheduled
        # wakeup only ends the turn early.
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
