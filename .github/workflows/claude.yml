name: Claude Code

# Same setup as jzfgo/carroquesi: one workflow for the automatic first review
# and for `@claude` follow-ups.
#
# Runs triggered by `issue_comment` are attributed to the DEFAULT branch (a
# comment carries no ref), so `gh run list --branch <feature>` never finds them.
# This run-name gives each run a PR-scoped handle instead:
#   gh run list --workflow=claude.yml --json databaseId,displayTitle
#
# It must stay quoted. Unquoted, YAML reads the " #" as the start of a comment
# and the name truncates to "Claude —", losing the number it exists to carry.
run-name: "Claude — #${{ github.event.issue.number || github.event.pull_request.number }}"

# A PR that edits THIS FILE gets no Claude review. claude-code-action refuses a
# workflow file that differs from the default branch's copy, so a PR cannot
# rewrite its own reviewer and run it with the repo's secrets. The refusal exits
# green having reviewed nothing; the guard step below turns that into a red
# check. Changes here take effect on merge, and the first later PR that does
# not touch this file is what proves them.

on:
  # Automatic first-pass review. Deliberately NOT `synchronize`: a full review on
  # every push is noisy and costly. Ask for follow-ups with an `@claude` comment.
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # THIS REPOSITORY IS PUBLIC. Only `pull_request` runs from forks are denied
    # secrets; the other four triggers run in the base repo context with full
    # secrets whoever wrote the comment, and follow what the comment says. Every
    # trigger therefore requires a trusted author. Do not remove these checks
    # while `claude_args` grants write-capable tools such as `Bash(gh api:*)`.
    if: |
      (github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # On `pull_request` the checkout is the merge commit, so a PR that does not
      # touch this file compares identical to the base branch. Only
      # `pull_request` runs attach a check to the PR, so only they need the guard.
      - name: Refuse to no-op when this PR edits the review workflow
        if: github.event_name == 'pull_request'
        run: |
          git fetch --quiet --depth=1 origin "$GITHUB_BASE_REF"
          if ! git diff --quiet FETCH_HEAD -- .github/workflows/claude.yml; then
            echo "::error file=.github/workflows/claude.yml::This PR edits the review workflow, so claude-code-action would refuse to run and exit green having reviewed nothing. Failing instead: review this PR by hand. The edit takes effect on merge, and the first later PR that does not touch this file is what proves it."
            exit 1
          fi

      # The review plugin, pinned to one commit like the action below. Loading it
      # through `plugin_marketplaces` would read the catalog from a default
      # branch and run whatever landed there that day, with this job's token and
      # tools. It loads with `--plugin-dir` (in `claude_args`), not as a
      # marketplace: Claude Code accepts the `claude-plugins-official` catalog
      # name only from the `anthropics` org on GitHub.
      #
      # Move this `ref:` by hand: pick a commit that touches plugins/code-review
      # and is at least 7 days old.
      #
      # The plugin reads the repo's rules from CLAUDE.md, which here is already
      # a symlink to AGENTS.md, so no extra link is needed.
      - name: Check out the review plugin at a pinned commit
        uses: actions/checkout@v7
        with:
          repository: anthropics/claude-plugins-official
          ref: 9780cf407f5593727b668bae95a0c4ae2e0de1ae # code-review 1.0.1, 2026-10-26
          path: .review-plugins
          persist-credentials: false

      # An `@claude` run that commits could pick the plugin checkout up with
      # `git add .`, so git is told to ignore it.
      - name: Keep the plugin checkout out of git
        run: echo /.review-plugins >> .git/info/exclude

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # `pull_request` runs have no comment to follow, so they run the
          # code-review plugin, which comments on each line it has an issue with
          # and posts "No issues found" otherwise. Every other trigger passes an
          # empty prompt, so the action follows the comment that mentioned
          # @claude; `@claude /code-review:code-review` also works there.
          #
          # No `track_progress`, on purpose: tag mode would wrap the slash
          # command as plain text so it never runs, and its tracking comment
          # would sit beside the plugin's own, so every review would post twice.
          # The plugin posts on its own: `gh pr comment` for the summary, and the
          # inline-comment tool allowed in `claude_args`.
          prompt: ${{ github.event_name == 'pull_request' && format('/code-review:code-review --comment {0}/pull/{1}', github.repository, github.event.pull_request.number) || '' }}

          # `--model`: without it the action runs on Sonnet, and v1 has no
          # `model` input, so `claude_args` is the only vehicle.
          #
          # `--allowedTools` is an AUTO-APPROVAL list: a tool left off it still
          # exists, but its call hits a permission prompt nothing in CI can
          # answer, so it comes back denied. This adds to the defaults.
          # - The inline-comment tool is how the plugin comments on a line;
          #   allowing it is also what makes the action start its server.
          # - WebSearch/WebFetch let the reviewer check claims against sources.
          # - `Bash(gh api:*)` lets it read repo configuration not in the tree
          #   (rulesets, required checks, run status). It also accepts
          #   `-X POST`/`-X DELETE`; the author gate above is what keeps that safe.
          # - No git Bash rules at all, not even "read-only" subcommands. A prefix
          #   rule cannot vet arguments: `git -c <key>=<cmd>`, `git config` and
          #   `git grep -O<cmd>` run commands, `--output=<file>` on log/diff/show
          #   writes any file, and a bare repo committed in a PR can carry its
          #   own config (fsmonitor, pager) that any git call inside it obeys.
          #   The job's `contents: read` does not contain that: the action acts
          #   with its own app token. The reviewer reads code with Read and Grep.
          claude_args: '--model claude-opus-5-5 --plugin-dir ${{ github.workspace }}/.review-plugins/plugins/code-review --allowedTools "mcp__github_inline_comment__create_inline_comment,WebSearch,WebFetch,Bash(gh api:*)"'
